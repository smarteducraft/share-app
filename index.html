<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웹앱 공유 게시판</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--line:#e2e8f0;--text:#14213d;--muted:#64748b;--brand:#4f46e5}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;font-family:Inter,Pretendard,'Noto Sans KR',Arial,sans-serif;background:#f6f8fc;color:var(--text)}
    body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    body.runner-mode{grid-template-rows:1fr}
    body.runner-mode .shellbar{display:none}
    .shellbar{min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.04);z-index:5}
    .title{font-weight:900}.subtitle{font-size:12px;color:var(--muted);margin-left:6px}.spacer{flex:1}
    .user{display:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 10px;background:#fff;max-width:320px}.user.show{display:flex}.userText{min-width:0}.userText strong,.userText span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userText strong{font-size:12px}.userText span{font-size:10px;color:var(--muted)}
    .logout{border:0;background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 9px;font-weight:800}
    .bridgeStatus{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:999px;padding:6px 9px;white-space:nowrap;cursor:pointer;user-select:none}.bridgeStatus.ok{color:#047857;background:#ecfdf5;border-color:#a7f3d0}.bridgeStatus.bad{color:#991b1b;background:#fff1f2;border-color:#fecaca}
    #topGoogleButton{display:flex;align-items:center;min-height:40px}
    .boardViewport{position:relative;min-height:0;overflow:hidden;background:#f6f8fc}
    #boardFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f6f8fc;display:block}
    .modalBack{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalBack.open{display:flex}.modal{width:min(460px,100%);background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(15,23,42,.25);overflow:hidden}.modalHead{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modalHead h2{margin:0;font-size:18px}.close{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer}.modalBody{padding:22px;display:grid;gap:16px}.modalBody p{margin:0;color:var(--muted);line-height:1.7}.googleSlot{display:flex;justify-content:center;min-height:44px}.notice{font-size:12px;color:#475569;background:#f8fafc;border:1px solid var(--line);padding:11px 12px;border-radius:10px;line-height:1.6}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:70;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#991b1b}
    @media(max-width:650px){.subtitle{display:none}.title{font-size:14px}.userText span{display:none}.shellbar{padding:8px}.user{max-width:180px}}
  </style>
</head>
<body>
  <div class="shellbar">
    <div class="title">🚀 웹앱 공유 게시판</div>
    <div class="subtitle">열람은 누구나 · 글 작성은 Google 로그인</div>
    <div class="spacer"></div>
    <div class="bridgeStatus" id="bridgeStatus" title="연결이 되지 않으면 클릭해서 다시 연결">● 게시판 연결 확인</div>
    <div id="topGoogleButton"></div>
    <div class="user" id="userBox">
      <div class="userText"><strong id="userName">Google 사용자</strong><span id="userEmail"></span></div>
      <button class="logout" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="boardViewport">
    <iframe id="boardFrame" title="웹앱 공유 게시판" referrerpolicy="no-referrer"></iframe>
  </div>

  <div class="modalBack" id="loginModal">
    <div class="modal">
      <div class="modalHead"><h2>Google 로그인 후 작성</h2><button class="close" id="closeLogin">✕</button></div>
      <div class="modalBody">
        <p>게시판은 누구나 볼 수 있지만 웹앱을 올리려면 Google 로그인이 필요합니다.</p>
        <div class="googleSlot" id="modalGoogleButton"></div>
        <div class="notice">로그인 계정의 고유 식별자와 이메일은 게시물 작성자 확인을 위해 관리자용 DB에만 저장되고 게시판에는 공개되지 않습니다.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       ★ 아래 두 값만 실제 값으로 바꾸세요.
       ========================================================= */
    const GOOGLE_CLIENT_ID = '1071416155552-3odg2uqlv547elnbp93s3fc8tkqc4l9q.apps.googleusercontent.com';
    const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzEXmaSxS74Zfcx9wbb2MGI8CSkS_TNBxWN1KAYeIBw0L4y1k2xM5t_ygZDqsQNnRsy/exec';
    const PUBLIC_BOARD_URL = 'https://smarteducraft.github.io/share-app/';
    const CANONICAL_PATH = '/share-app/';

    // 주소창은 항상 GitHub Pages의 대표 주소로 유지합니다.
    if(location.pathname !== CANONICAL_PATH || location.search || location.hash){
      history.replaceState(null, document.title, CANONICAL_PATH);
    }

    const TOKEN_KEY = 'webappBoardGoogleIdToken';
    const LEGACY_TOKEN_KEY = 'studentWebappBoardGoogleIdToken';
    const boardFrame = document.getElementById('boardFrame');
    const loginModal = document.getElementById('loginModal');
    const userBox = document.getElementById('userBox');
    const topGoogleButton = document.getElementById('topGoogleButton');
    const modalGoogleButton = document.getElementById('modalGoogleButton');
    const toast = document.getElementById('toast');
    const bridgeStatus = document.getElementById('bridgeStatus');

    let googleInitialized = false;
    let boardOrigin = '';
    let boardBridgeWindow = null;
    let bridgeReady = false;
    let verifiedUser = null;
    let bridgeWatchTimer = null;
    let bridgeReloadAttempts = 0;
    const BRIDGE_VERSION = '20260916-v3';
    let bridgeNonce = '';

    // Apps Script 내부 HTML이 window.top(이 GitHub 페이지)으로 직접 보내는 메시지를 먼저 받습니다.
    window.addEventListener('message', handleBoardMessage);

    document.getElementById('closeLogin').addEventListener('click', closeLoginModal);
    document.getElementById('logoutBtn').addEventListener('click', logoutBoard);
    bridgeStatus.addEventListener('click', reconnectBoard);
    loginModal.addEventListener('click', e => { if(e.target === loginModal) closeLoginModal(); });

    boardFrame.addEventListener('load', () => {
      if(document.body.classList.contains('runner-mode')) return;
      setBridgeStatus('checking');
      startBridgeWatch();
    });

    // GitHub wrapper 안의 iframe은 잘라내지 않습니다.
    // 기존 42px 강제 크롭이 Apps Script 본문 상단까지 가려 화면이 잘리는 원인이었습니다.
    loadBoardFrame(true);
    setBridgeStatus('checking');
    startBridgeWatch();
    initGoogleWhenReady();

    function handleBoardMessage(event){
      const data = event.data || {};
      const type = String(data.type || '');

      const allowedTypes = new Set([
        'STUDENT_BOARD_READY',
        'STUDENT_BOARD_REQUEST_LOGIN',
        'STUDENT_BOARD_AUTH_VERIFIED',
        'STUDENT_BOARD_AUTH_INVALID',
        'STUDENT_BOARD_AUTH_EXPIRED',
        'STUDENT_BOARD_RUN_APP'
      ]);
      if(!allowedTypes.has(type)) return;

      // Apps Script iframe마다 발급한 임시 nonce가 일치해야만 메시지를 신뢰합니다.
      // Apps Script HTML Service가 Google의 중간 iframe을 사용해 event.origin이 달라져도
      // nonce와 WindowProxy를 함께 검증하므로 안정적으로 연결할 수 있습니다.
      if(!bridgeNonce || String(data.bridgeNonce || '') !== bridgeNonce) return;

      const googleOrigin = isTrustedBoardOrigin(event.origin) || event.origin === 'null';
      if(!googleOrigin){
        console.warn('[WebAppBoard] 예상하지 못한 origin:', event.origin, type);
        return;
      }

      if(type === 'STUDENT_BOARD_READY' || (!bridgeReady && type === 'STUDENT_BOARD_REQUEST_LOGIN')){
        const wasReady = bridgeReady && event.source === boardBridgeWindow;

        boardBridgeWindow = event.source;
        boardOrigin = event.origin || 'null';
        bridgeReady = Boolean(boardBridgeWindow);

        if(bridgeReady){
          bridgeReloadAttempts = 0;
          setBridgeStatus('ok');
          if(bridgeWatchTimer){ clearTimeout(bridgeWatchTimer); bridgeWatchTimer = null; }
        }

        if(bridgeReady && !wasReady){
          console.info('[WebAppBoard] 인증 브리지 연결:', boardOrigin, BRIDGE_VERSION);
          sendStoredTokenToBoard();
        }

        if(bridgeReady && type === 'STUDENT_BOARD_READY' && !data.acknowledged){
          sendToBoard({type:'STUDENT_BOARD_PARENT_HELLO'});
        }
      }

      // READY 이후에는 최초에 기억한 WindowProxy에서 온 동일 nonce 메시지만 처리합니다.
      if(!bridgeReady || event.source !== boardBridgeWindow) return;

      if(type === 'STUDENT_BOARD_REQUEST_LOGIN'){
        openLoginModal();
        return;
      }

      if(type === 'STUDENT_BOARD_RUN_APP'){
        const appId = String(data.appId || '').trim();
        if(appId) openAppInBoardFrame(appId);
        return;
      }

      if(type === 'STUDENT_BOARD_AUTH_VERIFIED'){
        setBridgeStatus('ok');
        verifiedUser = data.user || null;
        renderUser();
        closeLoginModal();
        showToast('Google 로그인이 완료되었습니다.');
        return;
      }

      if(type === 'STUDENT_BOARD_AUTH_INVALID' || type === 'STUDENT_BOARD_AUTH_EXPIRED'){
        clearStoredToken();
        verifiedUser = null;
        renderUser();
        if(type === 'STUDENT_BOARD_AUTH_EXPIRED'){
          showToast('로그인 시간이 만료되었습니다. 다시 로그인해 주세요.', true);
          openLoginModal();
        }else{
          showToast('Google 로그인 확인에 실패했습니다. Apps Script 설정과 배포 상태를 확인해 주세요.', true);
        }
      }
    }

    function setBridgeStatus(state){
      bridgeStatus.className = 'bridgeStatus';
      if(state === 'ok'){
        bridgeStatus.classList.add('ok');
        bridgeStatus.textContent = '● 게시판 연결됨';
      }else if(state === 'bad'){
        bridgeStatus.classList.add('bad');
        bridgeStatus.textContent = '● 연결 확인 필요';
      }else{
        bridgeStatus.textContent = '● 게시판 연결 확인';
      }
    }

    function createBridgeNonce(){
      try{
        const bytes = new Uint8Array(24);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
      }catch(e){
        return `${Date.now()}_${Math.random().toString(36).slice(2)}_${Math.random().toString(36).slice(2)}`.replace(/[^A-Za-z0-9_-]/g,'');
      }
    }

    function buildBoardUrl(forceFresh=false){
      const joiner = APPS_SCRIPT_WEB_APP_URL.includes('?') ? '&' : '?';
      const params = new URLSearchParams();
      params.set('bridgeNonce', bridgeNonce);
      params.set('bridge', BRIDGE_VERSION);
      if(forceFresh) params.set('fresh', String(Date.now()));
      return `${APPS_SCRIPT_WEB_APP_URL}${joiner}${params.toString()}`;
    }

    function loadBoardFrame(forceFresh=false){
      bridgeReady = false;
      boardBridgeWindow = null;
      boardOrigin = '';
      bridgeNonce = createBridgeNonce();
      boardFrame.src = buildBoardUrl(forceFresh);
    }

    function pokeBoardFrame(){
      // 비밀정보가 없는 HELLO만 보냅니다. 실제 Apps Script HTML이 직접 받는 경우와
      // Google의 중간 iframe이 있는 경우를 모두 고려해 계속 시도합니다.
      try{
        if(boardFrame.contentWindow){
          boardFrame.contentWindow.postMessage({
            type:'STUDENT_BOARD_PARENT_HELLO',
            bridgeVersion:BRIDGE_VERSION,
            bridgeNonce
          }, '*');
        }
      }catch(e){}

      // READY로 실제 내부 WindowProxy를 이미 알게 된 경우에는 그 창에도 직접 보냅니다.
      try{
        if(boardBridgeWindow && boardOrigin){
          boardBridgeWindow.postMessage({
            type:'STUDENT_BOARD_PARENT_HELLO',
            bridgeVersion:BRIDGE_VERSION,
            bridgeNonce
          }, boardOrigin === 'null' ? '*' : boardOrigin);
        }
      }catch(e){}
    }

    function startBridgeWatch(attempt=0){
      if(document.body.classList.contains('runner-mode') || bridgeReady) return;
      if(bridgeWatchTimer) clearTimeout(bridgeWatchTimer);

      pokeBoardFrame();
      const delays = [350, 700, 1200, 2000, 3200, 4800, 6500];

      if(attempt >= delays.length){
        // 캐시나 이전 Apps Script HTML이 남아 있는 경우를 대비해 한 번만 강제 재로드합니다.
        if(bridgeReloadAttempts < 1){
          bridgeReloadAttempts += 1;
          console.warn('[WebAppBoard] READY 미수신 → Apps Script iframe을 새 주소로 1회 다시 불러옵니다.');
          setBridgeStatus('checking');
          loadBoardFrame(true);
          bridgeWatchTimer = setTimeout(() => startBridgeWatch(0), 900);
          return;
        }

        setBridgeStatus('bad');
        console.warn('[WebAppBoard] Apps Script 인증 브리지 READY를 받지 못했습니다. 배포가 최신인지, 웹앱 접근 권한이 누구나인지 확인하세요.');
        return;
      }

      bridgeWatchTimer = setTimeout(() => {
        if(!bridgeReady) startBridgeWatch(attempt + 1);
      }, delays[attempt]);
    }

    function reconnectBoard(){
      if(document.body.classList.contains('runner-mode')) return;
      bridgeReloadAttempts = 0;
      setBridgeStatus('checking');
      showToast('게시판 연결을 다시 확인합니다.');
      loadBoardFrame(true);
      setTimeout(() => startBridgeWatch(0), 700);
    }

    function isTrustedBoardOrigin(origin){
      try{
        const url = new URL(origin);
        if(url.protocol !== 'https:') return false;
        const host = url.hostname.toLowerCase();
        return host === 'script.google.com' ||
               host === 'script.googleusercontent.com' ||
               host.endsWith('.googleusercontent.com');
      }catch(e){
        return false;
      }
    }

    function sendToBoard(message){
      if(!bridgeReady || !boardBridgeWindow || !bridgeNonce) return false;
      const payload = { ...message, bridgeNonce };
      boardBridgeWindow.postMessage(payload, boardOrigin === 'null' ? '*' : boardOrigin);
      return true;
    }

    function openAppInBoardFrame(appId){
      // 앱을 새 탭으로 열지 않고 현재 GitHub 페이지의 iframe 안에서 실행합니다.
      // 따라서 주소창은 https://smarteducraft.github.io/share-app/ 로 계속 유지됩니다.
      const runnerUrl = `${APPS_SCRIPT_WEB_APP_URL}?mode=run&id=${encodeURIComponent(appId)}`;

      bridgeReady = false;
      boardBridgeWindow = null;
      boardOrigin = '';
      if(bridgeWatchTimer){ clearTimeout(bridgeWatchTimer); bridgeWatchTimer = null; }

      // 앱 실행 중에는 GitHub 상단 바도 숨겨 실행 영역을 브라우저 전체 높이로 확보합니다.
      document.body.classList.add('runner-mode');
      boardFrame.src = runnerUrl;
    }

    function initGoogleWhenReady(attempt=0){
      if(googleInitialized) return;
      if(!(window.google && google.accounts && google.accounts.id)){
        if(attempt < 100) setTimeout(() => initGoogleWhenReady(attempt + 1), 100);
        return;
      }

      if(!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes('여기에_')){
        showToast('GitHub index.html에 Google Client ID를 입력해 주세요.', true);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        ux_mode: 'popup',
        auto_select: false
      });
      googleInitialized = true;
      renderGoogleButtons();
    }

    function renderGoogleButtons(){
      if(!googleInitialized || verifiedUser) return;
      topGoogleButton.innerHTML = '';
      modalGoogleButton.innerHTML = '';

      google.accounts.id.renderButton(topGoogleButton, {
        type:'standard', theme:'outline', size:'medium', text:'signin_with', shape:'pill', logo_alignment:'left'
      });
      google.accounts.id.renderButton(modalGoogleButton, {
        type:'standard', theme:'outline', size:'large', text:'continue_with', shape:'rectangular', logo_alignment:'left', width:300
      });
    }

    function handleGoogleCredential(response){
      const token = response && response.credential ? response.credential : '';
      if(!token){
        showToast('Google 계정 인증은 열렸지만 ID 토큰을 받지 못했습니다.', true);
        return;
      }

      try{
        sessionStorage.setItem(TOKEN_KEY, token);
        sessionStorage.removeItem(LEGACY_TOKEN_KEY);
      }catch(e){}
      if(!bridgeReady){
        showToast('Google 계정 인증 완료 · 게시판 연결이 확인되면 자동으로 로그인됩니다.');
        setBridgeStatus('checking');
        startBridgeWatch();
        return;
      }

      showToast('Google 계정 인증 성공 · 게시판에서 확인 중입니다.');
      sendTokenToBoard(token);
    }

    function getStoredToken(){
      try{
        return sessionStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(LEGACY_TOKEN_KEY) || '';
      }catch(e){
        return '';
      }
    }

    function sendStoredTokenToBoard(){
      const token = getStoredToken();
      if(token) sendTokenToBoard(token);
    }

    function sendTokenToBoard(token){
      if(!token || !bridgeReady) return;
      sendToBoard({
        type:'STUDENT_BOARD_AUTH_TOKEN',
        idToken:token
      });
    }

    function openLoginModal(){
      loginModal.classList.add('open');
      if(googleInitialized) setTimeout(renderGoogleButtons, 0);
    }

    function closeLoginModal(){ loginModal.classList.remove('open'); }

    function logoutBoard(){
      clearStoredToken();
      verifiedUser = null;
      renderUser();
      try{ if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
      sendToBoard({type:'STUDENT_BOARD_AUTH_LOGOUT'});
      showToast('게시판에서 로그아웃했습니다.');
    }

    function clearStoredToken(){
      try{
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(LEGACY_TOKEN_KEY);
      }catch(e){}
    }

    function renderUser(){
      if(verifiedUser){
        topGoogleButton.style.display = 'none';
        userBox.classList.add('show');
        document.getElementById('userName').textContent = verifiedUser.name || 'Google 사용자';
        document.getElementById('userEmail').textContent = verifiedUser.email || '';
      }else{
        userBox.classList.remove('show');
        topGoogleButton.style.display = 'flex';
        if(googleInitialized) setTimeout(renderGoogleButtons,0);
      }
    }

    let toastTimer;
    function showToast(message,isError=false){
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast show${isError ? ' error' : ''}`;
      toastTimer = setTimeout(() => toast.className='toast', 3200);
    }
  </script>
</body>
</html>
