<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeRun 앱 실행</title>
  <style>
    :root{
      /*
       * Google Apps Script가 웹앱 위에 붙이는
       * "이 애플리케이션은 Google Apps Script 사용자가 만들었습니다." 안내 영역 높이.
       * 브라우저에서 조금 보이면 42를 44~48px로 올리고,
       * 앱 화면이 잘리면 36~40px로 낮추면 됩니다.
       */
      --gas-notice-height:42px;
      --bar-height:52px;
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      font-family:Inter,Pretendard,'Noto Sans KR',Arial,sans-serif;
      background:#0f172a;
      overflow:hidden;
    }

    .shell{
      width:100%;
      height:100dvh;
      min-height:0;
      display:grid;
      grid-template-rows:var(--bar-height) minmax(0,1fr);
    }

    .bar{
      position:relative;
      z-index:20;
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      padding:8px 14px;
      background:#111827;
      color:#fff;
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 3px 10px rgba(15,23,42,.24);
    }

    .title{min-width:0;flex:1}
    .title strong{
      display:block;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title span{
      display:block;
      margin-top:2px;
      color:#94a3b8;
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      flex:0 0 auto;
      padding:6px 9px;
      border:1px solid #1d4ed8;
      border-radius:999px;
      background:#1e3a8a;
      color:#bfdbfe;
      font-size:11px;
      white-space:nowrap;
    }

    .btn{
      flex:0 0 auto;
      border:1px solid #334155;
      border-radius:9px;
      background:#1e293b;
      color:#fff;
      padding:8px 10px;
      font:inherit;
      font-size:12px;
      font-weight:700;
      text-decoration:none;
      white-space:nowrap;
      cursor:pointer;
    }
    .btn:hover{background:#334155}

    /*
     * 핵심:
     * Apps Script 페이지를 --gas-notice-height 만큼 위로 올려
     * Google 안내 문구가 viewport 바깥으로 숨겨지도록 합니다.
     * 상단에는 GitHub 쪽 VibeRun bar가 남으므로 사용자는 기존 상단바만 보게 됩니다.
     */
    .viewport{
      position:relative;
      min-height:0;
      overflow:hidden;
      background:#fff;
    }

    #runnerFrame{
      position:absolute;
      left:0;
      top:calc(-1 * var(--gas-notice-height));
      width:100%;
      height:calc(100% + var(--gas-notice-height));
      border:0;
      background:#fff;
    }

    .error{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:24px;
      background:#fff;
      color:#334155;
      text-align:center;
    }
    .error.show{display:grid}

    @media(max-width:640px){
      :root{--bar-height:48px}
      .bar{gap:7px;padding:7px 8px}
      .badge{display:none}
      .btn{padding:7px 8px;font-size:11px}
      .title span{display:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="title">
        <strong id="appTitle">VibeRun 웹앱</strong>
        <span id="appAuthor"></span>
      </div>

      <span class="badge" id="modeBadge">🔒 격리 실행</span>

      <button class="btn" type="button" id="reloadBtn">↻ 다시 실행</button>

      <a class="btn" id="externalOpen" href="#" target="_blank" rel="noopener" hidden>
        ↗ 새 창
      </a>

      <a class="btn" href="https://smarteducraft.github.io/share-app/" rel="noopener">
        ← VibeRun
      </a>
    </div>

    <div class="viewport">
      <iframe
        id="runnerFrame"
        title="VibeRun 웹앱 실행 화면"
        referrerpolicy="no-referrer"
        allow="fullscreen; clipboard-read; clipboard-write"></iframe>

      <div class="error" id="errorBox">
        <div>
          <strong>앱을 실행할 수 없습니다.</strong><br><br>
          게시판으로 돌아가 다시 실행해 주세요.
        </div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbwrwX3MxebpWJkDhI3K-lfME-01ZWwF6wr1y9RKZmhzGNk4nOqx3tfo6tvJEuTtZOeA/exec';

    const params = new URLSearchParams(location.search);
    const appId = String(params.get('id') || '').trim();
    const title = String(params.get('title') || 'VibeRun 웹앱');
    const author = String(params.get('author') || '');
    const sourceType = String(params.get('sourceType') || 'FILE').toUpperCase() === 'URL'
      ? 'URL'
      : 'FILE';
    const originalAppUrl = String(params.get('appUrl') || '').trim();

    const titleEl = document.getElementById('appTitle');
    const authorEl = document.getElementById('appAuthor');
    const badgeEl = document.getElementById('modeBadge');
    const externalOpen = document.getElementById('externalOpen');
    const frame = document.getElementById('runnerFrame');
    const errorBox = document.getElementById('errorBox');

    titleEl.textContent = title;
    document.title = `${title} | VibeRun`;

    if(author){
      authorEl.textContent = `제작: ${author}`;
    }else{
      authorEl.textContent = 'VibeRun Web App Playground';
    }

    if(sourceType === 'URL'){
      badgeEl.textContent = '🔗 배포 링크';
      if(/^https:\/\/\S+$/i.test(originalAppUrl)){
        externalOpen.href = originalAppUrl;
        externalOpen.hidden = false;
      }
    }

    function buildRunnerUrl(){
      const joiner = APPS_SCRIPT_WEB_APP_URL.includes('?') ? '&' : '?';
      return `${APPS_SCRIPT_WEB_APP_URL}${joiner}mode=run&id=${encodeURIComponent(appId)}`;
    }

    function loadRunner(){
      if(!appId){
        errorBox.classList.add('show');
        return;
      }

      // 재실행 시에도 새 URL로 강제 로드되도록 cache-buster를 붙입니다.
      const url = `${buildRunnerUrl()}&vr=${Date.now()}`;
      frame.src = url;
    }

    document.getElementById('reloadBtn').addEventListener('click', () => {
      frame.src = 'about:blank';
      setTimeout(loadRunner, 40);
    });

    loadRunner();
  </script>
</body>
</html>
