<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= appTitle ?></title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{font-family:Inter,Pretendard,'Noto Sans KR',Arial,sans-serif;background:#0f172a;overflow:hidden}
    .shell{width:100%;height:100vh;height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
    .bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#111827;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);min-width:0}
    .title{min-width:0;flex:1}
    .title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
    .title span{display:block;color:#94a3b8;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{font-size:11px;color:#bfdbfe;background:#1e3a8a;border:1px solid #1d4ed8;padding:6px 9px;border-radius:999px;white-space:nowrap}
    .btn{border:1px solid #334155;background:#1e293b;color:#fff;padding:8px 10px;border-radius:9px;font-weight:700;text-decoration:none;font-size:12px;white-space:nowrap}
    .btn:hover{background:#334155}
    iframe{display:block;width:100%;height:100%;min-width:0;min-height:0;border:0;background:#fff}
    @media(max-width:640px){.badge{display:none}.bar{padding:8px;gap:6px}.btn{padding:7px 8px;font-size:11px}.title span{display:none}.title strong{font-size:12px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="title">
        <strong><?= appTitle ?></strong>
        <span>제작: <?= author ?></span>
      </div>
      <span class="badge">🔒 격리 실행</span>
      <button class="btn" type="button" onclick="reloadStudentApp()">↻ 다시 실행</button>
      <a class="btn" href="<?= boardUrl ?>" target="_top" rel="noopener">← 게시판</a>
    </div>
    <!--
      중요: allow-same-origin을 의도적으로 넣지 않았습니다.
      따라서 업로드된 앱은 게시판의 DOM/cookie/localStorage에 접근할 수 없습니다.
      단, 이 보안 모드에서는 앱 자체의 localStorage/sessionStorage가 제한될 수 있습니다.
    -->
    <iframe
      id="studentApp"
      sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock"
      referrerpolicy="no-referrer"
      title="웹앱 실행 화면"></iframe>
  </div>

  <script>
    const APP_BASE64 = <?!= JSON.stringify(appBase64) ?>;
    let decodedHtml = '';

    function decodeUtf8Base64(base64){
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function loadStudentApp(){
      if(!decodedHtml) decodedHtml = decodeUtf8Base64(APP_BASE64);
      document.getElementById('studentApp').srcdoc = decodedHtml;
    }

    function reloadStudentApp(){
      const frame = document.getElementById('studentApp');
      frame.srcdoc = '';
      setTimeout(loadStudentApp, 30);
    }

    loadStudentApp();
  </script>
</body>
</html>
